syntax = "proto3";

package api.chat;

option go_package = "gochat/api/api/chat";

import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

// 消息类型枚举
enum MessageType {
  TEXT = 0;        // 文字消息
  IMAGE = 1;       // 图片消息
  FILE = 2;        // 文件消息
  SYSTEM = 3;      // 系统消息
  VIDEO = 4;       // 视频消息
  VOICE = 5;       // 语音条消息
  EMOJI = 6;       // 表情包消息
  MERGE = 7;       // 合并消息
  QUOTE = 8;       // 引用消息
  CONTACT = 9;     // 联系人分享消息
  RED_PACKET = 10; // 红包消息
  TRANSFER = 11;   // 转账消息
}

// 消息状态枚举
enum MessageStatus {
  SENDING = 0;     // 发送中
  SENT = 1;        // 已发送
  DELIVERED = 2;   // 已送达
  READ = 3;        // 已读
  FAILED = 4;      // 发送失败
}

// 聊天消息
message ChatMessage {
  string id = 1;                    // 消息ID
  uint32 from_user_id = 2;          // 发送者用户ID
  uint32 to_user_id = 3;            // 接收者用户ID（私聊时使用，群聊时为0）
  uint32 group_id = 12;             // 群组ID（群聊时使用，私聊时为0）
  MessageType message_type = 4;     // 消息类型
  string content = 5;               // 消息内容
  string file_url = 6;              // 文件URL（图片/文件消息）
  string file_name = 7;             // 文件名
  int64 file_size = 8;              // 文件大小
  // 扩展字段
  string video_url = 13;            // 视频URL
  string video_thumb = 14;          // 视频缩略图
  string voice_url = 15;            // 语音URL
  int32 voice_duration = 16;        // 语音时长（秒）
  string emoji_url = 17;            // 表情包URL
  string merge_messages = 18;       // JSON数组，合并消息的message_id列表
  string quote_message_id = 19;     // 引用的消息ID
  uint32 contact_user_id = 20;      // 分享的联系人ID
  uint32 red_packet_id = 21;        // 关联的红包ID
  uint32 transfer_id = 22;           // 关联的转账ID
  // 状态字段
  bool is_recalled = 23;            // 是否已撤回
  bool is_deleted = 24;             // 是否已删除
  int32 read_status = 25;           // 已读状态：1=已发送，2=已读
  MessageStatus status = 9;         // 消息状态
  google.protobuf.Timestamp created_at = 10;  // 创建时间
  google.protobuf.Timestamp updated_at = 11;  // 更新时间
}

// 发送消息请求
message SendMessageRequest {
  uint32 to_user_id = 1;            // 接收者用户ID（私聊时使用）
  uint32 group_id = 7;              // 群组ID（群聊时使用，与to_user_id二选一）
  MessageType message_type = 2;     // 消息类型
  string content = 3;               // 消息内容
  string file_url = 4;              // 文件URL（可选）
  string file_name = 5;             // 文件名（可选）
  int64 file_size = 6;              // 文件大小（可选）
  // 扩展字段
  string video_url = 13;            // 视频URL
  string video_thumb = 14;          // 视频缩略图
  string voice_url = 15;            // 语音URL
  int32 voice_duration = 16;        // 语音时长（秒）
  string emoji_url = 17;            // 表情包URL
  repeated string merge_message_ids = 18;  // 合并消息的message_id列表
  string quote_message_id = 19;     // 引用的消息ID
  uint32 contact_user_id = 20;      // 分享的联系人ID
  uint32 red_packet_id = 21;        // 关联的红包ID
  uint32 transfer_id = 22;           // 关联的转账ID
}

// 发送消息响应
message SendMessageResponse {
  ChatMessage message = 1;          // 发送的消息
  bool success = 2;                 // 是否成功
  string error_message = 3;         // 错误信息
}

// 获取消息历史请求
message GetMessageHistoryRequest {
  // @inject_tag: form:"other_user_id"
  uint32 other_user_id = 1;         // 对方用户ID（私聊时使用）
  // @inject_tag: form:"group_id"
  uint32 group_id = 5;               // 群组ID（群聊时使用，与other_user_id二选一）
  // @inject_tag: form:"page"
  int32 page = 2;                   // 页码（从1开始）
  // @inject_tag: form:"page_size"
  int32 page_size = 3;              // 每页数量
  // @inject_tag: form:"before_time"
  google.protobuf.Timestamp before_time = 4;  // 获取此时间之前的消息（可选）
}

// 获取消息历史响应
message GetMessageHistoryResponse {
  repeated ChatMessage messages = 1;  // 消息列表
  int32 total_count = 2;             // 总数量
  int32 current_page = 3;            // 当前页码
  int32 page_size = 4;               // 每页数量
  bool has_more = 5;                 // 是否有更多
}

// 搜索用户请求
message SearchUserRequest {
  // @inject_tag: form:"keyword"
  string keyword = 1;                // 关键词（昵称/手机号/邮箱/登录账号）
  // @inject_tag: form:"login_account"
  string login_account = 2;          // 精准搜索登录账号（优先级高于keyword）
  // @inject_tag: form:"online_only"
  bool online_only = 3;               // 是否只显示在线用户
}

// 搜索用户响应
message SearchUserResponse {
  repeated UserInfo users = 1;       // 用户列表
  int32 total_count = 2;             // 总数量
}

// 用户信息
message UserInfo {
  uint32 id = 1;                     // 用户ID
  string name = 2;                    // 用户名
  string phone = 3;                   // 手机号
  string email = 4;                   // 邮箱
  string avatar = 5;                  // 头像URL
  bool is_online = 6;                 // 是否在线
  google.protobuf.Timestamp last_seen = 7;  // 最后在线时间
}

// 标记消息为已读请求
message MarkMessageReadRequest {
  uint32 other_user_id = 1;          // 对方用户ID
  string message_id = 2;             // 消息ID（可选，为空则标记所有消息）
}

// 标记消息为已读响应
message MarkMessageReadResponse {
  bool success = 1;                  // 是否成功
  int32 marked_count = 2;            // 标记的消息数量
  string error_message = 3;          // 错误信息
}

// 获取未读消息数量请求
message GetUnreadCountRequest {
  // 空请求，获取当前用户的所有未读消息数量
}

// 获取未读消息数量响应
message GetUnreadCountResponse {
  int32 total_unread = 1;            // 总未读数量
  map<uint32, int32> unread_by_user = 2;  // 按用户分组的未读数量
}

// 上传文件请求
message UploadFileRequest {
  string biz = 1;  // 业务类型（可选）
}

// 上传文件响应
message UploadFileResponse {
  string file_url = 1;   // 文件完整URL
  string file_name = 2;  // 文件名
  int64 file_size = 3;   // 文件大小
  string file_type = 4;  // 文件类型（image/document/video/voice/emoji）
}

// 撤回消息请求
message RecallMessageRequest {
  string message_id = 1 [(validate.rules).string.min_len = 1];  // 消息ID
}

// 撤回消息响应
message RecallMessageResponse {
  bool success = 1;  // 是否成功
}

// 删除消息请求
message DeleteMessageRequest {
  string message_id = 1 [(validate.rules).string.min_len = 1];  // 消息ID
  bool delete_for_both = 2;  // 是否双向删除（仅私聊有效）
}

// 删除消息响应
message DeleteMessageResponse {
  bool success = 1;  // 是否成功
}

// 转发消息请求
message ForwardMessageRequest {
  repeated string message_ids = 1 [(validate.rules).repeated = {min_items: 1, max_items: 100}];  // 要转发的消息ID列表（1-100条）
  uint32 to_user_id = 2;            // 接收者用户ID（私聊时使用）
  uint32 group_id = 3;              // 群组ID（群聊时使用，与to_user_id二选一）
  string content = 4;               // 转发时的附加内容（可选）
}

// 转发消息响应
message ForwardMessageResponse {
  repeated ChatMessage messages = 1;  // 转发后的消息列表
  int32 forwarded_count = 2;         // 成功转发的消息数量
  bool success = 3;                 // 是否成功
  string error_message = 4;          // 错误信息
}

// 收藏消息请求
message FavoriteMessageRequest {
  string message_id = 1 [(validate.rules).string.min_len = 1];  // 消息ID
}

// 收藏消息响应
message FavoriteMessageResponse {
  bool success = 1;  // 是否成功
}

// 取消收藏消息请求
message UnfavoriteMessageRequest {
  string message_id = 1 [(validate.rules).string.min_len = 1];  // 消息ID
}

// 取消收藏消息响应
message UnfavoriteMessageResponse {
  bool success = 1;  // 是否成功
}

// 获取收藏消息列表请求
message GetFavoriteMessagesRequest {
  // @inject_tag: form:"page"
  int32 page = 1 [(validate.rules).int32 = {gt: 0}];      // 页码
  // @inject_tag: form:"page_size"
  int32 page_size = 2 [(validate.rules).int32 = {gt: 0, lte: 100}];  // 每页数量
}

// 获取收藏消息列表响应
message GetFavoriteMessagesResponse {
  repeated ChatMessage messages = 1;  // 收藏的消息列表
  int32 total_count = 2;             // 总数量
  int32 current_page = 3;            // 当前页码
  int32 page_size = 4;               // 每页数量
}

// 聊天服务定义
service ChatService {
  // 搜索用户
  rpc SearchUser(SearchUserRequest) returns (SearchUserResponse);
  
  // 发送消息
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  
  // 获取消息历史
  rpc GetMessageHistory(GetMessageHistoryRequest) returns (GetMessageHistoryResponse);
  
  // 标记消息为已读
  rpc MarkMessageRead(MarkMessageReadRequest) returns (MarkMessageReadResponse);
  
  // 获取未读消息数量
  rpc GetUnreadCount(GetUnreadCountRequest) returns (GetUnreadCountResponse);
  
  // 上传文件
  rpc UploadFile(UploadFileRequest) returns (UploadFileResponse);
  
  // 撤回消息
  rpc RecallMessage(RecallMessageRequest) returns (RecallMessageResponse);
  
  // 删除消息
  rpc DeleteMessage(DeleteMessageRequest) returns (DeleteMessageResponse);
  
  // 转发消息
  rpc ForwardMessage(ForwardMessageRequest) returns (ForwardMessageResponse);
  
  // 收藏消息
  rpc FavoriteMessage(FavoriteMessageRequest) returns (FavoriteMessageResponse);
  
  // 取消收藏消息
  rpc UnfavoriteMessage(UnfavoriteMessageRequest) returns (UnfavoriteMessageResponse);
  
  // 获取收藏消息列表
  rpc GetFavoriteMessages(GetFavoriteMessagesRequest) returns (GetFavoriteMessagesResponse);
}
