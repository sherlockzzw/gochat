syntax = "proto3";

package api.friend;

option go_package = "gochat/api/api/friend";

import "google/protobuf/timestamp.proto";

// 添加好友请求
message AddFriendRequest {
  // @inject_tag: form:"friend_id"
  uint32 friend_id = 1;
  // @inject_tag: form:"message"
  string message = 2;
  // @inject_tag: form:"group_name"
  string group_name = 3;  // 自定义分组名称（可选）
}

// 添加好友响应
message AddFriendResponse {
  bool success = 1;
  string message = 2;
  uint32 request_id = 3;
}

// 获取好友列表请求
message GetFriendListRequest {
  // @inject_tag: form:"page"
  int32 page = 1;
  // @inject_tag: form:"page_size"
  int32 page_size = 2;
}

// 获取好友列表响应
message GetFriendListResponse {
  repeated FriendInfo friends = 1;
  int32 total_count = 2;
  int32 current_page = 3;
  int32 page_size = 4;
  bool has_more = 5;
}

// 好友信息
message FriendInfo {
  uint32 id = 1;
  string name = 2;
  string phone = 3;
  string email = 4;
  string avatar = 5;
  bool is_online = 6;
  string remark = 7;
  string group_name = 8;  // 自定义分组名称
  bool is_blocked = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp last_seen = 11;
}

// 获取好友申请列表请求
message GetFriendRequestsRequest {
  // @inject_tag: form:"page"
  int32 page = 1;
  // @inject_tag: form:"page_size"
  int32 page_size = 2;
}

// 获取好友申请列表响应
message GetFriendRequestsResponse {
  repeated FriendRequestInfo requests = 1;
  int32 total_count = 2;
  int32 current_page = 3;
  int32 page_size = 4;
  bool has_more = 5;
}

// 好友申请信息
message FriendRequestInfo {
  uint32 id = 1;
  uint32 from_user_id = 2;
  string from_user_name = 3;
  string from_user_avatar = 4;
  string message = 5;
  string status = 6; // pending, accepted, rejected
  string created_at = 7; // 创建时间（字符串格式）
}

// 处理好友申请请求
message HandleFriendRequestRequest {
  // @inject_tag: form:"request_id"
  uint32 request_id = 1;
  // @inject_tag: form:"action"
  string action = 2; // accept 或 reject
}

// 处理好友申请响应
message HandleFriendRequestResponse {
  bool success = 1;
  string message = 2;
}

// 删除好友请求
message DeleteFriendRequest {
  // @inject_tag: form:"friend_id"
  uint32 friend_id = 1;
}

// 删除好友响应
message DeleteFriendResponse {
  bool success = 1;
  string message = 2;
}

// 检查好友关系请求
message CheckFriendRequest {
  // @inject_tag: form:"friend_id"
  uint32 friend_id = 1;
}

// 检查好友关系响应
message CheckFriendResponse {
  bool is_friend = 1;
  bool is_blocked = 2;
  string remark = 3;
}

// 设置好友备注请求
message SetFriendRemarkRequest {
  // @inject_tag: form:"friend_id"
  uint32 friend_id = 1;
  // @inject_tag: form:"remark"
  string remark = 2;
}

// 设置好友备注响应
message SetFriendRemarkResponse {
  bool success = 1;
  string message = 2;
}

// 屏蔽好友请求
message BlockFriendRequest {
  // @inject_tag: form:"friend_id"
  uint32 friend_id = 1;
  // @inject_tag: form:"is_block"
  bool is_block = 2;
}

// 屏蔽好友响应
message BlockFriendResponse {
  bool success = 1;
  string message = 2;
}

// 获取好友详情请求
message GetFriendDetailRequest {
  // @inject_tag: form:"friend_id"
  uint32 friend_id = 1;
}

// 获取好友详情响应
message GetFriendDetailResponse {
  FriendInfo friend = 1;
  bool success = 2;
  string message = 3;
}

// 设置好友分组请求
message SetFriendGroupRequest {
  // @inject_tag: form:"friend_id"
  uint32 friend_id = 1;
  // @inject_tag: form:"group_name"
  string group_name = 2;  // 分组名称，空字符串表示移除分组
}

// 设置好友分组响应
message SetFriendGroupResponse {
  bool success = 1;
  string message = 2;
}

// 好友服务定义
service FriendService {
  // 添加好友
  rpc AddFriend(AddFriendRequest) returns (AddFriendResponse);
  
  // 获取好友列表
  rpc GetFriendList(GetFriendListRequest) returns (GetFriendListResponse);
  
  // 获取好友申请列表
  rpc GetFriendRequests(GetFriendRequestsRequest) returns (GetFriendRequestsResponse);
  
  // 处理好友申请
  rpc HandleFriendRequest(HandleFriendRequestRequest) returns (HandleFriendRequestResponse);
  
  // 删除好友
  rpc DeleteFriend(DeleteFriendRequest) returns (DeleteFriendResponse);
  
  // 检查好友关系
  rpc CheckFriend(CheckFriendRequest) returns (CheckFriendResponse);
  
  // 设置好友备注
  rpc SetFriendRemark(SetFriendRemarkRequest) returns (SetFriendRemarkResponse);
  
  // 屏蔽好友
  rpc BlockFriend(BlockFriendRequest) returns (BlockFriendResponse);
  
  // 获取好友详情
  rpc GetFriendDetail(GetFriendDetailRequest) returns (GetFriendDetailResponse);
  
  // 设置好友分组
  rpc SetFriendGroup(SetFriendGroupRequest) returns (SetFriendGroupResponse);
}
