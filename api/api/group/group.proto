syntax = "proto3";

package api.group;

option go_package = "gochat/api/api/group";

import "google/protobuf/timestamp.proto";
import "validate/validate.proto";

// 群组信息
message GroupInfo {
  uint32 id = 1;                      // 群ID
  string name = 2;                     // 群名称
  string avatar = 3;                   // 群头像
  uint32 owner_id = 4;                 // 群主ID
  string notice = 5;                   // 群公告
  int32 member_count = 6;              // 成员数量
  google.protobuf.Timestamp created_at = 7;  // 创建时间
  google.protobuf.Timestamp updated_at = 8;  // 更新时间
}

// 群成员信息
message GroupMemberInfo {
  uint32 id = 1;                       // 成员ID
  uint32 group_id = 2;                 // 群ID
  uint32 user_id = 3;                  // 用户ID
  string role = 4;                     // 角色: owner/admin/member
  string nickname = 5;                 // 群内昵称
  string user_name = 6;                // 用户名
  string user_avatar = 7;              // 用户头像
  string user_phone = 8;               // 用户手机号
  bool is_online = 9;                  // 是否在线
  google.protobuf.Timestamp joined_at = 10;  // 加入时间
}

// 创建群组请求
message CreateGroupRequest {
  string name = 1 [(validate.rules).string = {min_len: 1, max_len: 100}];  // 群名称
  string avatar = 2;                     // 群头像（可选）
  repeated uint32 member_ids = 3;         // 初始成员ID列表（不包括创建者）
}

// 创建群组响应
message CreateGroupResponse {
  GroupInfo group = 1;                 // 群组信息
  bool success = 2;                    // 是否成功
  string error_message = 3;            // 错误信息
}

// 获取群组信息请求
message GetGroupInfoRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1;                 // 群ID
}

// 获取群组信息响应
message GetGroupInfoResponse {
  GroupInfo group = 1;                 // 群组信息
  repeated GroupMemberInfo members = 2; // 成员列表
}

// 获取用户群组列表请求
message GetUserGroupsRequest {
  // 空请求，获取当前用户的群组列表
}

// 获取用户群组列表响应
message GetUserGroupsResponse {
  repeated GroupInfo groups = 1;        // 群组列表
  int32 total_count = 2;               // 总数量
}

// 添加群成员请求
message AddGroupMembersRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1 [(validate.rules).uint32.gt = 0];  // 群ID
  // @inject_tag: form:"user_ids"
  repeated uint32 user_ids = 2 [(validate.rules).repeated.min_items = 1];  // 要添加的用户ID列表
}

// 添加群成员响应
message AddGroupMembersResponse {
  bool success = 1;                     // 是否成功
  int32 added_count = 2;               // 成功添加的数量
  repeated uint32 failed_user_ids = 3;  // 添加失败的用户ID（可能已存在）
  string error_message = 4;            // 错误信息
}

// 移除群成员请求
message RemoveGroupMemberRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1 [(validate.rules).uint32.gt = 0];  // 群ID
  // @inject_tag: form:"user_id"
  uint32 user_id = 2 [(validate.rules).uint32.gt = 0];  // 要移除的用户ID
}

// 移除群成员响应
message RemoveGroupMemberResponse {
  bool success = 1;                    // 是否成功
  string error_message = 2;            // 错误信息
}

// 获取群成员列表请求
message GetGroupMembersRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1;                 // 群ID
}

// 获取群成员列表响应
message GetGroupMembersResponse {
  repeated GroupMemberInfo members = 1; // 成员列表
  int32 total_count = 2;               // 总数量
}

// 更新群组信息请求
message UpdateGroupInfoRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1;                 // 群ID
  string name = 2;                     // 群名称（可选）
  string avatar = 3;                   // 群头像（可选）
  string notice = 4;                   // 群公告（可选）
}

// 更新群组信息响应
message UpdateGroupInfoResponse {
  GroupInfo group = 1;                 // 更新后的群组信息
  bool success = 2;                    // 是否成功
  string error_message = 3;           // 错误信息
}

// 检查用户是否在群组中请求
message CheckMemberInGroupRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1;                 // 群ID
  // @inject_tag: form:"user_id"
  uint32 user_id = 2;                  // 用户ID
}

// 检查用户是否在群组中响应
message CheckMemberInGroupResponse {
  bool is_member = 1;                  // 是否在群组中
  string role = 2;                     // 角色（如果在群组中）
}

// 群主任命管理员请求
message AppointAdminRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1;                  // 群ID
  // @inject_tag: form:"user_id"
  uint32 user_id = 2;                   // 要任命为管理员的用户ID
}

// 群主任命管理员响应
message AppointAdminResponse {
  bool success = 1;                     // 是否成功
  string error_message = 2;            // 错误信息
}

// 移除管理员请求
message RemoveAdminRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1;                  // 群ID
  // @inject_tag: form:"user_id"
  uint32 user_id = 2;                   // 要移除的管理员用户ID
}

// 移除管理员响应
message RemoveAdminResponse {
  bool success = 1;                     // 是否成功
  string error_message = 2;            // 错误信息
}

// 禁言成员请求
message MuteMemberRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1;                  // 群ID
  // @inject_tag: form:"user_id"
  uint32 user_id = 2;                   // 被禁言用户ID
  // @inject_tag: form:"mute_duration"
  int32 mute_duration = 3;             // 禁言时长（秒），0表示永久禁言
  // @inject_tag: form:"reason"
  string reason = 4;                    // 禁言原因（可选）
}

// 禁言成员响应
message MuteMemberResponse {
  bool success = 1;                     // 是否成功
  string error_message = 2;            // 错误信息
}

// 解除禁言请求
message UnmuteMemberRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1;                  // 群ID
  // @inject_tag: form:"user_id"
  uint32 user_id = 2;                   // 被禁言用户ID
}

// 解除禁言响应
message UnmuteMemberResponse {
  bool success = 1;                     // 是否成功
  string error_message = 2;            // 错误信息
}

// 解散群组请求
message DissolveGroupRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1;                  // 群ID
}

// 解散群组响应
message DissolveGroupResponse {
  bool success = 1;                     // 是否成功
  string error_message = 2;            // 错误信息
}

// 转让群组请求
message TransferGroupRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1;                  // 群ID
  // @inject_tag: form:"new_owner_id"
  uint32 new_owner_id = 2;              // 新群主ID
}

// 转让群组响应
message TransferGroupResponse {
  bool success = 1;                     // 是否成功
  string error_message = 2;            // 错误信息
}

// 退出群组请求
message LeaveGroupRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1;                  // 群ID
}

// 退出群组响应
message LeaveGroupResponse {
  bool success = 1;                     // 是否成功
  string error_message = 2;            // 错误信息
}

// 管理员删除消息请求
message DeleteGroupMessageRequest {
  // @inject_tag: form:"group_id"
  uint32 group_id = 1;                  // 群ID
  // @inject_tag: form:"message_id"
  string message_id = 2;                // 消息ID
}

// 管理员删除消息响应
message DeleteGroupMessageResponse {
  bool success = 1;                     // 是否成功
  string error_message = 2;            // 错误信息
}

// 群组服务定义
service GroupService {
  // 创建群组
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
  
  // 获取群组信息
  rpc GetGroupInfo(GetGroupInfoRequest) returns (GetGroupInfoResponse);
  
  // 获取用户群组列表
  rpc GetUserGroups(GetUserGroupsRequest) returns (GetUserGroupsResponse);
  
  // 添加群成员
  rpc AddGroupMembers(AddGroupMembersRequest) returns (AddGroupMembersResponse);
  
  // 移除群成员
  rpc RemoveGroupMember(RemoveGroupMemberRequest) returns (RemoveGroupMemberResponse);
  
  // 获取群成员列表
  rpc GetGroupMembers(GetGroupMembersRequest) returns (GetGroupMembersResponse);
  
  // 更新群组信息
  rpc UpdateGroupInfo(UpdateGroupInfoRequest) returns (UpdateGroupInfoResponse);
  
  // 检查用户是否在群组中
  rpc CheckMemberInGroup(CheckMemberInGroupRequest) returns (CheckMemberInGroupResponse);
  
  // 群主任命管理员
  rpc AppointAdmin(AppointAdminRequest) returns (AppointAdminResponse);
  
  // 移除管理员
  rpc RemoveAdmin(RemoveAdminRequest) returns (RemoveAdminResponse);
  
  // 禁言成员
  rpc MuteMember(MuteMemberRequest) returns (MuteMemberResponse);
  
  // 解除禁言
  rpc UnmuteMember(UnmuteMemberRequest) returns (UnmuteMemberResponse);
  
  // 解散群组
  rpc DissolveGroup(DissolveGroupRequest) returns (DissolveGroupResponse);
  
  // 转让群组
  rpc TransferGroup(TransferGroupRequest) returns (TransferGroupResponse);
  
  // 退出群组
  rpc LeaveGroup(LeaveGroupRequest) returns (LeaveGroupResponse);
  
  // 管理员删除消息
  rpc DeleteGroupMessage(DeleteGroupMessageRequest) returns (DeleteGroupMessageResponse);
}

