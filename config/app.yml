app:
  mode: dev
  api_port: 8080
  admin_port: 8081

mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: password
  database: gochat

redis:
  host: 127.0.0.1
  port: 6379
  password: password
  db: 0

mongodb:
  uri: mongodb://root:password@127.0.0.1:27017
  database: gochat

websocket:
  port: 8082
  read_buffer_size: 1024
  write_buffer_size: 1024
  max_connections: 5000  # 最大并发连接数，0表示无限制
  ping_interval: 30      # 心跳ping间隔（秒），前端发送ping的间隔
  pong_wait: 60          # 心跳超时时间（秒），超过此时间未收到pong则断开连接

call:
    timeout_seconds: 60  # 超时时间（秒）

token:
  encryptionKey: examplekey946666
  expire: 24 # token过期时间，单位小时